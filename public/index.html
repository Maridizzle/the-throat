<!doctype html>
<!-- The Throat client shell. Signed Maridizzle -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Throat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/throat.css">
</head>
<body class="q2">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vig"></div>
<div class="grain"></div>

<header class="panel" id="topbar">
  <div id="title"><h1>THE THROAT</h1></div>
  <p id="sync">Connecting...</p>
  <div id="presence" hidden aria-label="Who is online"></div>
</header>

<main id="map-space" class="panel" aria-label="Story map">
  <canvas id="c" aria-label="Story map. Drag to orbit, scroll to fly in and out."></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="eraHead" aria-hidden="true"></div>
  <div id="hint">Drag to orbit. Scroll to zoom. Click the map, then W / S glide and A / D turn. Click a node, or the timeline below, to fly there.</div>
  <div class="panel" id="mini"><canvas id="mm" width="200" height="100"></canvas><div class="mmbar"><small>OVERVIEW</small><span><button id="mmView" type="button" aria-label="Switch the overview between top-down and side view">Top</button> <button id="mmBig" type="button" aria-label="Make the overview larger or smaller">Expand</button></span></div></div>
</main>

<div class="panel" id="legend"><h2>Layers</h2></div>

<div class="panel" id="detail" aria-live="polite"></div>

<div class="panel" id="strip"><canvas id="st" aria-label="Timeline. Click or drag to fly along story time."></canvas><div id="stTip"></div></div>

<div class="panel" id="controls">
  <label>Quality
    <select id="qsel"><option value="0">Low</option><option value="1">Medium</option><option value="2" selected>High</option></select>
  </label>
  <label><input type="checkbox" id="calm"> Calm mode</label>
  <button id="reset" type="button">Reset view</button>
  <button id="newNode" type="button">New node</button>
  <button id="erasBtn" type="button">Eras</button>
  <button id="importBtn" type="button">Import</button>
  <button id="exportBtn" type="button">Export</button>
  <button id="historyBtn" type="button">History</button>
  <button id="chatBtn" type="button">Chat</button>
  <button id="hiddenBtn" type="button" style="display:none">Hidden (0)</button>
</div>

<nav id="tabbar" class="panel" aria-label="Sections">
  <button type="button" data-tab="map" class="on"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5l5-2 4 2 5-2v12l-5 2-4-2-5 2z"/><path d="M8 3v12M12 5v12"/></svg>Map</button>
  <button type="button" data-tab="chat"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v9H8l-4 3v-3H3z"/></svg>Chat</button>
  <button type="button" data-tab="layers"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l7 4-7 4-7-4z"/><path d="M3 11l7 4 7-4M3 14l7 4 7-4"/></svg>Layers</button>
  <button type="button" data-tab="history"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10a7 7 0 1 0 2-5"/><path d="M3 3v4h4M10 6v4l3 2"/></svg>History</button>
  <button type="button" data-tab="more"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="16" cy="10" r="1.5"/></svg>More</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<div id="state" class="panel" role="status"></div>

<noscript><div class="panel" style="top:50%;left:50%;transform:translate(-50%,-50%);padding:22px 28px">This map needs JavaScript.</div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/app.js"></script>
<script src="js/accessibility.js"></script>
</body>
</html>
